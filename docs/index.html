<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindSpark – Daily Brain Challenge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0c1e;
      color: #e0d9f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .content { max-width: 480px; }
    .icon { font-size: 72px; margin-bottom: 20px; }
    h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #6c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    p { color: #8b7fc7; font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #6c4dff, #a855f7);
      color: #fff;
      padding: 12px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="content">
    <div class="icon">⚡</div>
    <h1>MindSpark</h1>
    <p>Daily Brain Challenge – Train your mind with puzzles, logic games, and trivia. Available on Android.</p>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="delete-account.html" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">Delete Account</a>
    </div>
  </div>
</body>
</html>
