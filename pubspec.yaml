name: mindspark
description: MindSpark — Daily Brain Challenge
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  fl_chart: ^0.69.0
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  audioplayers: ^6.4.0
  equatable: ^2.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_crashlytics: ^5.4.0
  firebase_app_check: ^0.4.8
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  lottie: ^3.3.1
  in_app_purchase: ^3.2.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon/App Icon.png"
  adaptive_icon_background: "#1A1730"
  adaptive_icon_foreground: "assets/images/app_icon/App Icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon/
    - assets/images/onboarding/
    - assets/images/home_screen assets/
    - assets/images/puzzle_hub_icons/
    - assets/images/famous_mind_illustrations/
    - assets/images/memoryflip_card/
    - assets/images/celebrations/
    - assets/images/acheivements/
    - assets/images/share_result_card_background/
    - assets/images/store_screen_theme/
    - assets/images/store_assets/main_store/frames/
    - assets/images/store_assets/main_store/power_ups/
    - assets/images/store_assets/main_store/title_badge/
    - assets/images/store_assets/arena_store/frames/
    - assets/images/store_assets/arena_store/theme/
    - assets/images/store_assets/arena_store/title_badge/
    - assets/images/store_assets/arena_store/victor_flair/
    - assets/images/avatars/classic/
    - assets/images/avatars/coin store/
    - assets/images/avatars/funny characters/
    - assets/images/avatars/level characters/
    - assets/images/avatars/scientists/
    - assets/images/avatars/streak characters/
    - assets/images/avatars/arena/
    - assets/images/currency/
    - assets/images/stats/
    - assets/images/mode_icons/
    - assets/images/new/
    - assets/images/practice_mode/
    - assets/images/biltz_mode/
    - assets/images/arena_mode/
    - assets/images/who_am_i/
    - assets/images/science_snap/
    - assets/images/word_ladder/
